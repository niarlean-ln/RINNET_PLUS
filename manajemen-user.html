<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen User - RINNET PLUS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>Tambah Akun User Baru</h2>
  
  <form id="userForm" onsubmit="simpanUserAkun(event)">
    <input type="text" id="inputUsername" placeholder="Username" autocapitalize="none" autocorrect="off" required />
    <input type="password" id="inputPassword" placeholder="Password" required />
    <input type="text" id="inputWA" placeholder="Nomor WhatsApp" />
    
    <select id="selectRole">
      <option value="SUPERADMIN">SUPERADMIN</option>
      <option value="ADMIN">ADMIN</option>
      <option value="RESELLER">RESELLER</option>
    </select>

    <div>
      <label><input type="checkbox" id="chkInput" checked> Izin Transaksi / Input</label>
      <label><input type="checkbox" id="chkExport"> Izin Export Data</label>
      <label><input type="checkbox" id="chkDelete"> Izin Hapus Data</label>
    </div>

    <button type="submit">Simpan Akun User</button>
  </form>

  <hr>

  <h2>Daftar Akun User (Cloud)</h2>
  <table border="1">
    <thead>
      <tr>
        <th>Username</th>
        <th>WhatsApp</th>
        <th>Role</th>
        <th>Izin Akses</th>
      </tr>
    </thead>
    <tbody id="tabelUserBody">
      <!-- Data dari Supabase akan dirender di sini -->
    </tbody>
  </table>

  <script src="supabase-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
